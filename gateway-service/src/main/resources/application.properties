server.port=8080
spring.application.name=gateway-service

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ===== USER-SERVICE =====
spring.cloud.gateway.routes[12].id=user-service-auth
spring.cloud.gateway.routes[12].uri=lb://user-service
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/auth/**

# ===== USER-SERVICE =====
spring.cloud.gateway.routes[13].id=user-service-register
spring.cloud.gateway.routes[13].uri=lb://user-service
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/users/register
spring.cloud.gateway.routes[13].order=-1

